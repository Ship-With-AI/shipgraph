name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # corepack reads "packageManager" in package.json and pins pnpm.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # One turbo invocation orchestrates build → typecheck → test with the
      # dependency graph (^build) + caching declared in turbo.json.
      - name: Build, typecheck, test
        run: pnpm exec turbo run build typecheck test
