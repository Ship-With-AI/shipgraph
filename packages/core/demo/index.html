<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@shipgraph/core demo — feel primitives on real graph.json</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: #0b0f14; color: #e6edf3;
        font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; overflow: hidden; }
      #graph { position: fixed; inset: 0; }
      .panel { position: fixed; z-index: 10; background: rgba(13,18,24,.82);
        border: 1px solid #26303c; border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(6px); }
      #hud { top: 10px; left: 10px; min-width: 220px; }
      #hud h1 { font-size: 12px; margin: 0 0 6px; letter-spacing: .04em; color: #9db3c9; text-transform: uppercase; }
      #hud .row { display: flex; justify-content: space-between; gap: 12px; margin: 2px 0; }
      #hud .row b { color: #6ee7b7; font-variant-numeric: tabular-nums; }
      #hud .bad { color: #f87171; }
      #controls { top: 10px; right: 10px; max-width: 260px; }
      #controls label { display: block; margin: 3px 0; cursor: pointer; }
      #controls .btn { display: inline-block; margin: 4px 4px 0 0; padding: 4px 8px;
        border: 1px solid #2f6feb; border-radius: 6px; background: #16233b; color: #cfe0ff; cursor: pointer; user-select: none; }
      #controls hr { border: none; border-top: 1px solid #26303c; margin: 8px 0; }
      #filters label { font-size: 12px; }
    </style>
  </head>
  <body>
    <div id="graph"></div>
    <div id="hud" class="panel">
      <h1>@shipgraph/core</h1>
      <div class="row"><span>fps (ema)</span><b id="fps">–</b></div>
      <div class="row"><span>frame ms (p95)</span><b id="ms">–</b></div>
      <div class="row"><span>nodes</span><b id="nn">–</b></div>
      <div class="row"><span>links</span><b id="nl">–</b></div>
      <div class="row"><span>scale</span><b id="scale">1x</b></div>
      <div class="row"><span>settled</span><b id="settled">no</b></div>
    </div>
    <div id="controls" class="panel">
      <label><input type="checkbox" id="reduceMotion" /> reduced motion</label>
      <span class="btn" id="scale1">1x</span>
      <span class="btn" id="scale5">5x</span>
      <span class="btn" id="reheat">reheat</span>
      <span class="btn" id="fit">fit</span>
      <hr />
      <div>hover a node → 1-hop halo · click → eased focus · drag → spring-back</div>
      <hr />
      <div id="filters"></div>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
